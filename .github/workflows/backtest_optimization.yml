name: Adaptive BIST Orderflow Meta-Engine - Walk Forward Backtest

on:
  workflow_dispatch:
  schedule:
    # Monthly at 00:30 UTC on the 1st. GitHub Actions scheduling is not exact-minute guaranteed.
    - cron: '30 0 1 * *'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Real Data Backtest
        run: python backtest_optimizer.py --start-date 2022-01-01 --save
      - name: Commit Report
        run: |
          git config --local user.email "quantbot@github.com"
          git config --local user.name "QuantBot AI"
          git add backtest_report.json
          git diff --cached --quiet || (git commit -m "📊 Adaptive BIST walk-forward backtest" && git push)
