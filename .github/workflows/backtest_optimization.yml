name: BIST Real-Return Engine V3 - Walk Forward Backtest

on:
  workflow_dispatch:
  schedule:
    # Her ayın 2'si 03:40 UTC (ilk kurulumda elle bir kez çalıştırın)
    - cron: '40 3 2 * *'

permissions:
  contents: write

concurrency:
  group: bist-engine-state
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy requests yfinance
      - name: Walk-forward backtest (real data only)
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python backtest_optimizer.py --start-date 2012-01-01
      - name: Commit research prior, report and caches
        run: |
          git config --local user.email "quantbot@users.noreply.github.com"
          git config --local user.name "QuantBot AI"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "📚 V3 research prior + walk-forward report"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
