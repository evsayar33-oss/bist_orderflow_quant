name: BIST Meta-Engine V2 - Walk Forward Backtest (research prior)

on:
  workflow_dispatch:
  schedule:
    # Her ayın 1'i 03:40 UTC. İlk kurulumda Actions sekmesinden elle bir kez çalıştırın.
    - cron: '40 3 1 * *'

permissions:
  contents: write

concurrency:
  group: bist-meta-engine-state
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy requests yfinance
      - name: Walk-forward backtest (real adjusted data only)
        run: python backtest_optimizer.py --start-date 2019-01-01
      - name: Commit research prior and report
        run: |
          git config --local user.email "quantbot@users.noreply.github.com"
          git config --local user.name "QuantBot AI"
          git add data/research_prior.json data/backtest_report.json
          git diff --cached --quiet && exit 0
          git commit -m "📚 Meta-Engine V2 research prior + walk-forward report"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
