name: BIST Meta-Engine V2 - Daily EOD Run

on:
  schedule:
    # 18:25 Türkiye (UTC+3) = 15:25 UTC, hafta içi. Kapanış seansı 18:10'da biter.
    # GitHub zamanlamayı dakika hassasiyetinde garanti etmez; gecikme sorun değildir.
    - cron: '25 15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bist-meta-engine-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy requests yfinance
      - name: Run engine (after close)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
      - name: Commit data
        run: |
          git config --local user.email "quantbot@users.noreply.github.com"
          git config --local user.name "QuantBot AI"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "🧠 Meta-Engine V2 EOD run"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
