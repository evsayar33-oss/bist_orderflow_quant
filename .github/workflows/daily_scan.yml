name: BIST Real-Return Engine V3 - Daily Run (after close)

on:
  schedule:
    # 18:25 Türkiye = 15:25 UTC, hafta içi. Ayın ilk seansında aylık gözden geçirme otomatik yapılır.
    - cron: '25 15 * * 1-5'
  workflow_dispatch:
    inputs:
      yeniden_tara:
        description: 'Bu ayın hisse taramasını şimdi yeniden yap (bekleyen alımlar iptal edilip yeni kurallarla seçilir)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bist-engine-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy requests yfinance
      - name: Run engine
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
          BOQ_RESCAN: ${{ github.event.inputs.yeniden_tara || 'false' }}
        run: python main.py
      - name: Commit data
        run: |
          git config --local user.email "quantbot@users.noreply.github.com"
          git config --local user.name "QuantBot AI"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "🏛️ V3 daily run"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
