name: Adaptive BIST Orderflow Meta-Engine - Daily Scan

on:
  schedule:
    # Türkiye 10:35 (UTC+3 => 07:35 UTC), weekdays.
    - cron: '35 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adaptive-bist-daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Meta Engine
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
      - name: Commit State and Ledgers
        run: |
          git config --local user.email "quantbot@github.com"
          git config --local user.name "QuantBot AI"
          git add longterm_ai_state.json model_weights.json signals_log.csv signals_lifecycle.csv gecmis_veri.csv
          git diff --cached --quiet || (git commit -m "🧠 Adaptive BIST Meta-Engine daily scan" && git push)
