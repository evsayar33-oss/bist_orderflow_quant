name: Price Breakout - 90d prospective paper (no orders)

on:
  schedule:
    - cron: '40 17 * * 1-5' # 20:40 Turkey, after daily engine
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/price_breakout_paper.py'
      - 'tests/test_price_breakout_paper.py'
      - '.github/workflows/price_breakout_paper.yml'

permissions:
  contents: write

concurrency:
  group: bist-breakout-paper-state
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scipy requests yfinance
      - run: python -m unittest discover -s tests -p 'test_price_breakout_paper.py' -v
      - run: python -m py_compile research/price_breakout_paper.py

  paper:
    if: github.event_name != 'pull_request'
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy scipy requests yfinance
      - name: Snapshot protected production state
        run: |
          git ls-files data/ ':!:data/paper_breakout/' | xargs -r sha256sum > /tmp/paper-protected.sha256
      - name: Run paper simulation (no brokerage/API orders)
        run: python research/price_breakout_paper.py --output data/paper_breakout/paper_state.json
      - name: Assert production files unchanged
        if: always()
        run: |
          sha256sum --check /tmp/paper-protected.sha256
          git diff --exit-code -- data/ ':!data/paper_breakout/'
      - name: Save paper state only
        if: success()
        run: |
          git config user.name 'QuantBot Paper'
          git config user.email 'quantbot@users.noreply.github.com'
          git add data/paper_breakout/paper_state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'paper: update price breakout 90d forward ledger'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-breakout-paper-state
          path: data/paper_breakout/paper_state.json
          if-no-files-found: warn
          retention-days: 30
