name: BIST Variant Lab - alternative buying rules

on:
  workflow_dispatch:
  push:
    branches: [ccr-b00241bf-ozkvet]
    paths: [.github/workflows/variant_lab.yml]

permissions:
  contents: write

jobs:
  variants:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy requests yfinance
      - name: Walk-forward backtest + variants (live state not changed)
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python backtest_optimizer.py --start-date 2012-01-01 --no-save --variants
      - name: Commit variants report
        run: |
          git config --local user.email "quantbot@users.noreply.github.com"
          git config --local user.name "QuantBot AI"
          git add data/variants_report.json
          git diff --cached --quiet && exit 0
          git commit -m "🔬 Variant lab report"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
